name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # NOTE: android-actions/setup-android@v3 is broken with current
      # cmdline-tools (it runs `sdkmanager tools`, a package that no
      # longer exists -> exit 1). ubuntu-latest already ships an Android
      # SDK at $ANDROID_HOME, so use it directly.
      - name: Install Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER=""
          for d in latest 16.0 15.0; do
            if [ -x "$ANDROID_HOME/cmdline-tools/$d/bin/sdkmanager" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/$d/bin/sdkmanager"; break; fi
          done
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
